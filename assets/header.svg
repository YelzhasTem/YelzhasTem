<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Yelzhas</title>
  <desc id="description">I turn ideas into useful digital products. Exploring, building, and shipping with AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E1015"/>
      <stop offset="1" stop-color="#171B2D"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#7465ED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7465ED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="30%" cy="24%" r="85%">
      <stop stop-color="#E8E7FF"/>
      <stop offset="0.3" stop-color="#B8B4FF"/>
      <stop offset="0.67" stop-color="#7B77E8"/>
      <stop offset="1" stop-color="#393D88"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C9CBFF" stop-opacity="0.8"/>
      <stop offset="0.48" stop-color="#8C91EF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#819FF0" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A5ACEE" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="grid-fade">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.7" stop-color="white" stop-opacity="0.8"/>
      <stop offset="1" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>
    <mask id="grid-mask"><rect width="1280" height="320" fill="url(#grid-fade)"/></mask>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#background)"/>
    <ellipse cx="1080" cy="170" rx="340" ry="290" fill="url(#ambient)"/>
    <rect x="800" width="480" height="320" fill="url(#grid)" mask="url(#grid-mask)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <circle cx="78" cy="67" r="4" fill="#A5B0FF"/>
      <text x="94" y="72" fill="#A5B0FF" font-size="15" font-weight="700" letter-spacing="2.8">ALWAYS BUILDING</text>
      <text x="68" y="153" fill="#F3F4F6" font-size="72" font-weight="800" letter-spacing="-2.5">Hi, I’m Yelzhas</text>
      <text x="72" y="207" fill="#D3D8E3" font-size="26" font-weight="400">I turn ideas into useful digital products.</text>
      <text x="72" y="246" fill="#9DA7BA" font-size="23" font-weight="400">Exploring, building, and shipping with AI agents.</text>
    </g>

    <!-- An open-ended abstract system, independent of any individual project. -->
    <g fill="none" stroke="url(#orbit)">
      <ellipse cx="1062" cy="165" rx="148" ry="66" transform="rotate(-28 1062 165)" stroke-width="1.6"/>
      <ellipse cx="1062" cy="165" rx="138" ry="80" transform="rotate(37 1062 165)" stroke-width="1.2" opacity="0.7"/>
      <circle cx="1062" cy="165" r="108" stroke-width="1" opacity="0.25"/>
    </g>
    <circle cx="1062" cy="165" r="60" fill="#9C8FFF" opacity="0.3" filter="url(#glow)"/>
    <circle cx="1062" cy="165" r="48" fill="url(#sphere)"/>
    <path d="M931 202C954 218 1005 211 1053 190C1116 162 1165 126 1182 100" fill="none" stroke="url(#orbit)" stroke-width="1.8"/>
    <circle cx="1174" cy="109" r="7" fill="#C0C8FF"/>
    <circle cx="941" cy="211" r="4" fill="#8DA2ED"/>
    <circle cx="1134" cy="258" r="5" fill="#9A91DC"/>
    <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  </g>
</svg>
