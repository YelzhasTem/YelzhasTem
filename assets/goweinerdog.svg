      <text x="68" y="198" fill="#35231D" font-size="84" font-weight="800" letter-spacing="-2.5">GoWeinerDog</text>
      <text x="72" y="242" fill="#6B594A" font-size="23">Teach a pixel dachshund to find its way home —</text>
      <text x="72" y="272" fill="#6B594A" font-size="23">real Q-learning, right in the browser.</text>
      <rect x="75" y="307" width="132" height="34" rx="4" fill="#35231D"/><rect x="72" y="304" width="132" height="34" rx="4" fill="#FFFDF8" stroke="#35231D" stroke-width="2"/><text x="138.0" y="326" fill="#35231D" font-size="15" font-weight="700" text-anchor="middle">Q-learning</text>
